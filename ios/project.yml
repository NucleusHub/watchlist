name: Watchlist
options:
  bundleIdPrefix: com.nucleushome
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  # Switches to https://github.com/NucleusHub/nucleus-ui once that repo is published.
  NucleusUI:
    path: ../../../nucleus-ui

settings:
  base:
    DEVELOPMENT_TEAM: AJT82US5MR
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0

targets:
  Watchlist:
    type: application
    platform: iOS
    sources:
      - path: Watchlist
    dependencies:
      - package: NucleusUI
      - target: WatchlistWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nucleushome.watchlist
        PRODUCT_NAME: Watchlist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: Watchlist/Info.plist
      properties:
        CFBundleDisplayName: Watchlist
        CFBundleLocalizations: [en, cs]
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities: [arm64]
        NSCameraUsageDescription: Take a photo for a poster, a collection cover or a problem report.
        CFBundleURLTypes:
          - CFBundleURLName: com.nucleushome.watchlist
            CFBundleURLSchemes: [com.nucleushome.watchlist]

  WatchlistWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchlistWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nucleushome.watchlist.watchkitapp
        PRODUCT_NAME: WatchlistWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Watchlist
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.nucleushome.watchlist
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SKIP_INSTALL: YES

  WatchlistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WatchlistTests
        excludes: ["**/*.mjs", "**/*.js"]
      # The watch's snapshot types, to check the phone writes what the watch reads.
      - path: WatchlistWatch/Model.swift
    dependencies:
      - target: Watchlist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Watchlist.app/Watchlist

  WatchlistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WatchlistUITests
    dependencies:
      - target: Watchlist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Watchlist

schemes:
  Watchlist:
    build:
      targets:
        Watchlist: all
        WatchlistTests: [test]
        WatchlistUITests: [test]
    test:
      targets:
        - WatchlistTests
        - WatchlistUITests
    run:
      config: Debug
  WatchlistWatch:
    build:
      targets:
        WatchlistWatch: all
    run:
      config: Debug
